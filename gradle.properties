cobblemon_version=PdOzYHKU
moddev_version=2.0.147
neoforge_version=21.1.251
cobblemon_neoforge_version=xsVHrAsY
kotlin_neoforge_version=uhJhCT7X

# Mod
version=1.0.0
group=matheo1712.battlephone

# Cobblemon Trainers, the mod this one is built on, from the Modrinth Maven. Its Modrinth
# version numbers carry the loader (`<version>-fabric`, `<version>-neoforge`), which the builds
# append; this is the part they share. It has to be a version that is really published there.
cobblemon_trainers_version=2.0.0-alpha
# The lowest Cobblemon Trainers this mod declares it runs with, in fabric.mod.json and
# neoforge.mods.toml. Kept apart from the version above: that one is what Gradle can download,
# this one is what players are allowed to run. In semver 2.0.0-alpha comes *before* 2.0.0, so
# this turns the alpha away on purpose; nothing older than 2.0.0 is supported.
cobblemon_trainers_min_version=2.0.0
# Modrinth project of Cobblemon Trainers.
cobblemon_trainers_project=cobblemon-trainers-rerebleue

# Modrinth project of this mod (Settings > General, "Project ID"). An ID, not the slug: it
# never changes, whatever the project is renamed to.
modrinth_id=Qweokm2Z
